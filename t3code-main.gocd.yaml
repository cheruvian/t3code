format_version: 3

pipelines:
  t3code-main:
    group: t3code
    label_template: ${COUNT}
    lock_behavior: unlockWhenFinished
    materials:
      t3code:
        git: https://github.com/cheruvian/t3code.git
        branch: main
        shallow_clone: false
        auto_update: true
    stages:
      - build-and-deploy:
          clean_workspace: true
          jobs:
            package:
              resources: [t3-local]
              tasks:
                - exec:
                    command: pnpm
                    arguments: [install, --frozen-lockfile]
                - exec:
                    command: node
                    arguments: [scripts/gocd/local-pipeline.mjs, build, production]
                - exec:
                    command: node
                    arguments: [scripts/gocd/local-pipeline.mjs, deploy, production]
